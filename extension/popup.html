<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1a1a1a; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { font-size: 12px; color: #64748b; margin: 0 0 12px; }
    label { font-size: 12px; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    button { margin-top: 10px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #ff6b35; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    .status { font-size: 12px; margin-top: 10px; }
    .ok { color: #059669; }
    .err { color: #e11d48; }
    .note { font-size: 11px; color: #94a3b8; margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>The Applicant — Fit Check</h1>
  <p class="sub">Check your fit for the job you are viewing.</p>

  <label for="base">Your app URL</label>
  <input id="base" type="url" placeholder="https://your-app.onrender.com" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <p class="note">
    Sign in to The Applicant in this browser first. This add-on only reads the
    job text on the page when you click, and never changes the page or applies
    for you.
  </p>

  <script src="popup.js"></script>
</body>
</html>
